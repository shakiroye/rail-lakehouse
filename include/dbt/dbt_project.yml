    +persist_docs: {relation: true, columns: true}   # descriptions visibles dans Unity Catalog
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: ephemeral
    marts:
      +schema: gold
      +materialized: table

seeds:
  rail_lakehouse:
    +schema: silver
