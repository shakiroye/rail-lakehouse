version: 2

models:
  - name: mart_ponctualite_liaison_annuelle
    description: >
      Ponctualité annuelle par liaison, pour le classement du dashboard. Grain : une année x une liaison.
      Les taux sont des moyennes pondérées (somme des numérateurs / somme des dénominateurs), jamais des moyennes de taux.
      Le classement ne porte que sur les liaisons comparables (au moins 200 trains circulés dans l'année,
      seuil réglable via la variable seuil_trains_comparables).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [annee, liaison_id]
      # Un rang n'existe que pour une liaison comparable, et toute liaison comparable a un rang
      - dbt_utils.expression_is_true:
          name: mart_ponctualite_rang_si_comparable
          arguments:
            expression: "(rang_moins_ponctuelle is not null) = est_comparable"
    columns:
      - name: annee
        description: "Année"
      - name: liaison_id
        description: "Clé de la liaison (dim_liaison)"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_liaison')
                field: liaison_id
      - name: libelle_liaison
        description: "Libellé lisible de la liaison"
      - name: service
        description: "NATIONAL ou INTERNATIONAL"
      - name: nb_trains_prevus
        description: "Trains programmés sur l'année"
      - name: nb_trains_circules
        description: "Trains circulés sur l'année"
      - name: nb_annulations
        description: "Trains annulés sur l'année"
      - name: nb_trains_retard_arrivee
        description: "Trains arrivés en retard sur l'année"
      - name: taux_annulation
        description: "Annulations / trains prévus sur l'année"
      - name: taux_ponctualite_arrivee
        description: "1 - trains en retard / trains circulés sur l'année"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: part_retards_sup_30
        description: "Trains en retard de plus de 30 min / trains circulés (sous-estimée en 2025, données du T1 non fiables)"
      - name: est_comparable
        description: "Vrai si la liaison compte au moins 200 trains circulés dans l'année (variable seuil_trains_comparables)"
      - name: rang_moins_ponctuelle
        description: "Rang de la liaison dans l'année parmi les liaisons comparables, 1 = la moins ponctuelle. NULL si la liaison n'est pas comparable."

  - name: mart_causes_retard
    description: >
      Causes de retard dépivotées pour les graphiques. Grain : un mois x une liaison x une cause.
      Les mois où toutes les causes valent 0 (2018-05 à 2018-08) donnent 0 train attribué.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [liaison_id, mois, cause]
    columns:
      - name: liaison_id
        description: "Clé de la liaison (dim_liaison)"
      - name: mois
        description: "Premier jour du mois observé"
      - name: cause
        description: "Libellé de la cause de retard"
        data_tests:
          - accepted_values:
              arguments:
                values: ['Externe', 'Infrastructure', 'Gestion du trafic', 'Matériel roulant',
                         'Gestion en gare', 'Prise en charge voyageurs']
      - name: pct_cause
        description: "Part des retards due à cette cause, en %"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: nb_trains_retard_attribues
        description: "Trains en retard à l'arrivée x part de la cause, arrondi à 0,1"
